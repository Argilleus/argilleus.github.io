<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Library | Argilleus Music Library</title>

    <meta name="description"
          content="Browse the complete collection of free public domain sheet music from Argilleus.">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Dark mode toggle -->
<button
    id="themeToggle"
    class="theme-toggle-btn"
    aria-label="Toggle dark mode"
    title="Toggle dark mode">
</button>

<header>

    <h1>Argilleus Music Library</h1>

    <p class="tagline">
        Browse the complete collection.
    </p>

    <nav>
        <a href="index.html">Home</a>
    </nav>

</header>

<main>

<section class="library-layout">

    <aside class="filter-sidebar">

        <h3>Search</h3>

        <input
            type="text"
            id="searchInput"
            placeholder="Search title, composer, catalogue number...">

        <hr>

        <h3>Century</h3>

        <div id="centuryFilters">
            <!-- Generated automatically -->
        </div>

        <hr>

        <h3>Period</h3>

        <div id="periodFilters">
            <!-- Generated automatically -->
        </div>

        <hr>

        <h3>Instrumentation</h3>

        <div id="instrumentFilters">
            <!-- Generated automatically -->
        </div>

    </aside>

    <section class="library-content">

        <div class="library-summary">

            <p>
                Showing
                <strong>
                    <span id="resultCount">0</span>
                </strong>
                works.
            </p>

        </div>

        <div
            id="musicGrid"
            class="music-grid">

            <!-- Music cards are generated automatically from catalog.json -->

        </div>

    </section>

</section>

</main>

<footer>

    <hr>

    <p>
        © 2026 Argilleus.
    </p>

</footer>

<script src="library.js"></script>
<script src="theme.js"></script>

</body>

</html>
